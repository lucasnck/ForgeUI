name: forge_ui_showcase_flutter
description: Embedded Flutter Web examples for the Forge UI Showcase V2.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  forge_ui:
    path: ../library
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
dev_dependencies:
  flutter_test:
    sdk: flutter
